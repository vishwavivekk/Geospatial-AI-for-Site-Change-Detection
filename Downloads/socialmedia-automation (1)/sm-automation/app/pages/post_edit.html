<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post — NICDC Social Studio</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body data-role="editor" data-active="/" data-user="__USER_NAME__">
    <main class="workspace" id="screen">
        <div class="detail-head">
            <a class="back" href="/">← Post bank</a>
            <div>
                <h1 id="pe-title"></h1>
                <div class="submeta" id="pe-meta"></div>
            </div>
            <span></span>
        </div>
        <div id="change-banner-slot"></div>
        <div class="review-layout">
            <section class="stage">
                <div class="preview-bar"><span>Design preview · 1080 × 1080 px</span><span id="pe-kind"></span></div>
                <div class="large-art" id="imgHolder"><img id="postImg" alt="Post design"></div>
                <div class="caption" id="pe-caption-card"></div>
            </section>
            <aside class="feedback">
                <div class="panel-head"><div><h2>Feedback</h2><span id="pe-cmt-sub">No comments</span></div><span></span></div>
                <div class="comment-list" id="pe-comments"></div>
                <div class="workflow" id="pe-workflow"></div>
                <details class="history" id="pe-history-wrap" style="display:none;">
                    <summary>◫ Revision history　<small id="pe-history-count"></small>　⌄</summary>
                    <div id="pe-history"></div>
                </details>
            </aside>
        </div>
    </main>

    <input type="file" id="replaceFile" accept=".png,.jpg,.jpeg,.webp" class="hidden">

    <script src="/static/app.js"></script>
    <script>
        mountShell();
        const POST = __POST_JSON__;
        let _comments = POST.comments || [];
        let _canUseCanva = true;
        let _pulled = false;
        const EDITABLE = ['draft', 'feedback', 'rejected'].indexOf(POST.status) !== -1;

        document.getElementById('pe-title').textContent = POST.title;
        document.getElementById('postImg').src = '/bank/' + POST.image_path + '?v=' + Date.now();
        const KINDS = { upload: 'Uploaded design', html: 'HTML design', canva: 'Canva design', canvas: 'Canvas design' };
        document.getElementById('pe-kind').textContent = KINDS[POST.kind] || POST.kind;
        document.getElementById('pe-meta').innerHTML =
            statusBadge(POST.status) +
            '<span>Revision ' + (POST.revision || 1) + '</span>' +
            (POST.submitted_at ? '<span>Shared ' + fmtTime(POST.submitted_at) + '</span>' : '<span>Not shared yet</span>');

        /* Caption card */
        document.getElementById('pe-caption-card').innerHTML =
            '<div><b>Caption</b><span>' + (POST.caption || '').length + ' / 3,000</span></div>' +
            '<p>' + (POST.caption ? escHtml(POST.caption) : '<i style="color:#9aa39d">No caption yet — you write it when you share for approval.</i>') + '</p>';

        /* Change banner */
        if (POST.status === 'feedback') {
            document.getElementById('change-banner-slot').innerHTML =
                '<div class="change-banner"><span>◉</span><div>' +
                '<b>' + _comments.length + ' change' + (_comments.length !== 1 ? 's' : '') + ' requested' + (POST.reviewed_by ? ' by ' + escHtml(POST.reviewed_by) : '') + '</b>' +
                (POST.reviewer_note ? '<p>“' + escHtml(POST.reviewer_note) + '”</p>' : '<p>Address the pinned comments and resubmit.</p>') +
                '</div><small>' + fmtTime(POST.reviewed_at) + '</small></div>';
        }

        /* ── Region markers + comments ── */
        const holder = document.getElementById('imgHolder');
        function renderRegions(activeId) {
            holder.querySelectorAll('.region-box').forEach(el => el.remove());
            let n = 0;
            _comments.forEach(function (c) {
                if (!c.region) return;
                n += 1;
                const el = document.createElement('div');
                el.className = 'region-box' + (c.id === activeId ? ' hl' : '');
                el.style.left = (c.region.x * 100) + '%';
                el.style.top = (c.region.y * 100) + '%';
                el.style.width = (c.region.w * 100) + '%';
                el.style.height = (c.region.h * 100) + '%';
                el.innerHTML = '<span class="pin-n">' + n + '</span>';
                holder.appendChild(el);
            });
        }

        function renderComments(activeId) {
            const list = document.getElementById('pe-comments');
            document.getElementById('pe-cmt-sub').textContent = _comments.length
                ? _comments.length + ' open comment' + (_comments.length !== 1 ? 's' : '') : 'No comments on this revision';
            if (!_comments.length) {
                list.innerHTML = '<div style="padding:16px;text-align:center;font-size:9px;color:#8b958e;">No feedback yet — comments from the admin appear here with numbered pins on the design.</div>';
                renderRegions();
                return;
            }
            let n = 0;
            list.innerHTML = _comments.map(function (c) {
                const num = c.region ? ++n : null;
                return '<button class="comment' + (c.id === activeId ? ' active' : '') + '" data-id="' + c.id + '" data-linked="' + (c.region ? '1' : '') + '">' +
                    '<span class="comment-num' + (num ? '' : ' general') + '">' + (num || '•') + '</span>' +
                    '<span><b>' + escHtml(c.author || 'Admin') + '</b><small>' + fmtTime(c.created_at) + '</small><p>' + escHtml(c.text) + '</p></span>' +
                '</button>';
            }).join('');
            renderRegions(activeId);
        }
        document.getElementById('pe-comments').addEventListener('click', function (e) {
            const c = e.target.closest('.comment');
            if (c && c.dataset.linked) renderComments(c.dataset.id);
        });

        /* ── Revision history ── */
        const history = POST.feedback_history || [];
        if (history.length) {
            document.getElementById('pe-history-wrap').style.display = '';
            document.getElementById('pe-history-count').textContent = history.length + ' round' + (history.length !== 1 ? 's' : '');
            document.getElementById('pe-history').innerHTML = history.map(function (h) {
                return '<div style="margin-top:9px;"><span class="eyebrow">REVISION ' + h.revision + (h.reviewed_by ? ' · ' + escHtml(h.reviewed_by).toUpperCase() : '') + '</span>' +
                    (h.reviewer_note ? '<p style="font-size:8.5px;color:#59665d;margin:5px 0;">“' + escHtml(h.reviewer_note) + '”</p>' : '') +
                    (h.comments || []).map(c => '<div class="comment"><span class="comment-num general">•</span><span><b>' + escHtml(c.author || 'Admin') + '</b><p>' + escHtml(c.text) + '</p></span></div>').join('') +
                '</div>';
            }).join('');
        }

        /* ── Workflow steps ── */
        function renderWorkflow() {
            const wf = document.getElementById('pe-workflow');
            if (!EDITABLE) {
                if (POST.status === 'pending') {
                    wf.innerHTML = '<div class="workflow-title"><span>STATUS</span></div>' +
                        '<div style="font-size:9px;color:#7b867e;">⏱ Waiting for the admin\'s review. You\'ll see pinned feedback here if changes are requested.</div>';
                } else {
                    wf.innerHTML = '<div class="workflow-title"><span>PUBLISHED</span></div>' + publishResults(POST.publish_results) +
                        (POST.published_image_url ? '<a class="btn" style="width:100%;height:30px;font-size:8px;margin-top:8px;" href="' + escHtml(POST.published_image_url) + '" target="_blank">↗ Published image</a>' : '');
                }
                return;
            }
            const linked = !!POST.canva_design_id;
            const canvaBtns = _canUseCanva
                ? '<button class="btn primary" onclick="canvaOpen()">↗ ' + (linked ? 'Open in Canva' : 'Edit in Canva') + '</button>' +
                  (POST.kind === 'html' ? '<a class="btn ghost" href="/html-editor?post_id=' + POST.id + '">HTML editor</a>' : '<button class="btn ghost" onclick="document.getElementById(\'replaceFile\').click()">Replace image</button>')
                : (POST.kind === 'html' ? '<a class="btn primary" href="/html-editor?post_id=' + POST.id + '">&lt;/&gt; HTML editor</a>' : '<button class="btn primary" onclick="document.getElementById(\'replaceFile\').click()">▧ Replace image</button>');
            wf.innerHTML =
                '<div class="workflow-title"><span>YOUR WORKFLOW</span><span>3 steps</span></div>' +
                '<div class="step ' + (linked ? 'done' : 'current') + '"><i>' + (linked ? '✓' : '1') + '</i><div><b>Edit the design' + (_canUseCanva ? ' in Canva' : '') + '</b>' +
                    '<p>' + (_canUseCanva ? 'Open the original and apply the feedback.' : 'Update the design, or replace the image with a new export.') + '</p>' + canvaBtns + '</div></div>' +
                '<div class="step' + (_pulled ? ' done' : (linked ? ' current' : '')) + '"><i>' + (_pulled ? '✓' : '2') + '</i><div><b>Save &amp; bring it back</b><p>Pull the latest finished design into this post.</p>' +
                    (_canUseCanva ? '<button class="btn" id="pullBtn" onclick="canvaPull()"' + (linked ? '' : ' disabled') + '>↻ Import from Canva</button>' : '<p style="font-style:italic;">Not needed — replacing the image updates this post.</p>') + '</div></div>' +
                '<div class="step' + (_pulled ? ' current' : '') + '"><i>3</i><div><b>Send to the admin</b><p>Share the ' + (POST.status === 'feedback' ? 'revised' : 'finished') + ' design for approval.</p>' +
                    '<button class="btn primary" onclick="openShareDialog()">↗ Share for approval</button></div></div>' +
                (POST.status === 'draft' ? '<button class="btn" style="width:100%;height:30px;font-size:8px;color:var(--rust);" onclick="deletePost()">Delete draft</button>' : '');
        }

        /* ── Canva ── */
        async function canvaOpen() {
            try {
                const resp = await fetch('/api/posts/' + POST.id + '/canva/open', { method: 'POST' });
                const data = await resp.json();
                if (resp.status === 409) { toast('Connect your Canva account first'); setTimeout(() => location.href = '/canva/connect', 1000); return; }
                if (resp.status === 501) { toast('Canva is not configured on this server yet', 'error'); return; }
                if (!resp.ok) throw new Error(data.detail || 'Failed');
                if (!POST.canva_design_id) { POST.canva_design_id = data.design_id; renderWorkflow(); }
                window.open(data.edit_url, '_blank');
            } catch (e) { toast(e.message, 'error'); }
        }
        async function canvaPull() {
            const btn = document.getElementById('pullBtn');
            if (btn) { btn.disabled = true; btn.textContent = '↻ Importing...'; }
            try {
                const resp = await fetch('/api/posts/' + POST.id + '/canva/pull', { method: 'POST' });
                const data = await resp.json();
                if (resp.status === 409) { toast('Connect your Canva account first'); setTimeout(() => location.href = '/canva/connect', 1000); return; }
                if (!resp.ok) throw new Error(data.detail || 'Failed');
                POST.image_path = data.image_path;
                document.getElementById('postImg').src = '/bank/' + data.image_path + '?v=' + Date.now();
                _pulled = true;
                renderWorkflow();
                toast('Latest Canva design imported');
            } catch (e) {
                toast(e.message, 'error');
                if (btn) { btn.disabled = false; btn.textContent = '↻ Import from Canva'; }
            }
        }

        /* ── Replace image ── */
        document.getElementById('replaceFile').addEventListener('change', async function () {
            if (!this.files.length) return;
            const fd = new FormData();
            fd.append('image', this.files[0]);
            try {
                const resp = await fetch('/api/posts/' + POST.id, { method: 'PUT', body: fd });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Upload failed');
                POST.image_path = data.image_path;
                document.getElementById('postImg').src = '/bank/' + data.image_path + '?v=' + Date.now();
                toast('Design image replaced');
            } catch (e) { toast(e.message, 'error'); }
            this.value = '';
        });

        async function deletePost() {
            if (!confirm('Delete this draft from the post bank?')) return;
            try {
                const resp = await fetch('/api/posts/' + POST.id, { method: 'DELETE' });
                if (!resp.ok) throw new Error((await resp.json()).detail || 'Failed');
                window.location.href = '/';
            } catch (e) { toast(e.message, 'error'); }
        }

        /* ── Share dialog ── */
        function openShareDialog() {
            const plats = POST.platforms || [];
            const ck = p => (!plats.length && (p === 'linkedin' || p === 'x')) || plats.indexOf(p) !== -1 ? 'checked' : '';
            openDialog('↗', 'Share for approval', 'Choose where this post should publish after admin approval.',
                '<div class="feedback-msg" id="shErr"></div>' +
                '<span class="eyebrow">PUBLISH TO</span>' +
                '<div class="platform-select" style="margin-top:8px;">' +
                    '<label><input type="checkbox" id="pl-linkedin" ' + ck('linkedin') + '> in　LinkedIn</label>' +
                    '<label><input type="checkbox" id="pl-x" ' + ck('x') + '> 𝕏　X</label>' +
                    '<label><input type="checkbox" id="pl-instagram" ' + ck('instagram') + '> ◎　Instagram</label>' +
                '</div>' +
                '<label class="field">Caption<textarea id="shCaption" style="height:120px;">' + escHtml(POST.caption || '') + '</textarea></label>' +
                '<button class="btn ghost" style="height:30px;font-size:9px;padding:0;" id="aiCapBtn" onclick="genCaption()">✦ Generate caption with AI</button>',
                '<button class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary" id="shGo" onclick="sharePost()">Share with admin</button>');
        }
        function pickedPlatforms() {
            return ['linkedin', 'x', 'instagram'].filter(p => document.getElementById('pl-' + p).checked);
        }
        async function genCaption() {
            const btn = document.getElementById('aiCapBtn');
            btn.disabled = true; btn.textContent = '✦ Writing caption...';
            try {
                const resp = await fetch('/api/generate-caption', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: POST.title, description: POST.description || '',
                        platforms: pickedPlatforms(), current: document.getElementById('shCaption').value.trim(),
                    }),
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Failed');
                document.getElementById('shCaption').value = data.caption;
            } catch (e) { toast('Caption generation failed: ' + e.message, 'error'); }
            btn.disabled = false; btn.textContent = '✦ Generate caption with AI';
        }
        async function sharePost() {
            const platforms = pickedPlatforms();
            const err = document.getElementById('shErr');
            if (!platforms.length) { err.className = 'feedback-msg error'; err.textContent = 'Pick at least one platform.'; return; }
            const btn = document.getElementById('shGo');
            btn.disabled = true;
            try {
                const resp = await fetch('/api/posts/' + POST.id + '/share', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ caption: document.getElementById('shCaption').value.trim(), platforms: platforms }),
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Failed');
                closeDialog();
                toast('Revision shared with the admin');
                setTimeout(() => location.href = '/', 900);
            } catch (e) {
                err.className = 'feedback-msg error';
                err.textContent = e.message;
                btn.disabled = false;
            }
        }

        /* ── Init ── */
        document.getElementById('postImg').addEventListener('load', () => renderComments());
        renderComments();
        renderWorkflow();
        fetch('/api/me').then(r => r.json()).then(me => {
            if (me && me.can_use_canva === false) { _canUseCanva = false; renderWorkflow(); }
        }).catch(() => {});
    </script>
</body>
</html>
