# Plain HTTP redirects to HTTPS: some networks corrupt large HTTP uploads,
# and TLS also protects the login cookies.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/sm-studio.crt;
    ssl_certificate_key /etc/nginx/ssl/sm-studio.key;

    client_max_body_size 25m;

    # Main app
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Mock social media APIs — inspect published posts at /mock/published
    location /mock/ {
        rewrite ^/mock/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
    }
}
